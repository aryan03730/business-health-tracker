# Render Blueprint: creates the API (free web service) and the frontend (free static site).
# The database is a free PostgreSQL from Neon (Render's free Postgres is deleted after 30 days).
# In Render: New > Blueprint > pick this repo, then paste the Neon connection string
# into DATABASE_URL when asked.
services:
  - type: web
    name: bht-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://bht-web.onrender.com

  - type: web
    name: bht-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://bht-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
